<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberMonks — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/cybermonks.css">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <script>
    // Free mode: jump to panel before login UI paints (no cache)
    (async function () {
      try {
        var r = await fetch('/api/settings?t=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' });
        var d = await r.json();
        if (d && d.settings && String(d.settings.panelMode).toLowerCase() === 'free') {
          location.replace('/panel.html');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="cm-auth">
  <div class="cm-bg-pattern"></div>
  <div class="cm-wrap">
    <div class="cm-card" style="visibility:hidden">
      <img src="/assets/logo.png" alt="Panel" class="cm-logo" id="cmLoginLogo">
      <div class="cm-brand">
        <h1 id="cmLoginTitle">PANEL</h1>
        <p>Device Management Console</p>
      </div>
      <div id="loginError" class="cm-error"></div>
      <form id="loginForm">
        <div class="cm-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
        </div>
        <div class="cm-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn" class="cm-btn cm-btn-primary">Enter the Matrix</button>
      </form>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/branding.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
